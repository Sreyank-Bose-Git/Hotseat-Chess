<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="res/images/chess_logo.png">
    <link rel="stylesheet" href="chess.css">
    <title>Chess</title>
</head>
<body>
    <div id="sideBySide">
        <div id="columns">
            <div id="tcont">
                <table id="moves-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Piece</th>
                            <th>Previous Pos</th>
                            <th>Next Pos</th>
                            <th>Team</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="captures">
                <p class="capture" id="whiteC"><h1 class="h">White: </h1></p>
                <p class="capture" id="blackC"><h1 class="h">White: </h1></p>
            </div>
            <div id="clocks">
                <div class="clockDiv">
                    <h1>White:</h1>
                    <h1 id="whiteClock">Game Not Started</h1>
                </div>
                <div class="clockDiv">
                    <h1>Black:</h1>
                    <h1 id="blackClock">Game Not Started</h1>
                </div>
            </div>
        </div>
        <div id="board"></div>
        <div id="run">
            <button id="gameRunning" onclick="startGame()">Start Game</button>
            <br>
            <br>
            <br>
            <br>
            <label for="name">Time: (in ms)</label>
            <br>
            <br>
            <textarea class="ta" name="time" id="time"></textarea>
            <br>
            <br>
            <label for="increment">Increment: (in ms)</label>
            <br>
            <br>
            <textarea class="ta" name="increment" id="increment"></textarea>
            
        </div>  
    </div>

    <div id="promotionOptions">
        <button id="Queen" onclick="promotion(0);">Queen</button>
        <button id="Rook" onclick="promotion(1);">Rook</button>
        <button id="Bishop" onclick="promotion(2);">Bishop</button>
        <button id="Knight" onclick="promotion(3);">Knight</button>
    </div>

    <script src="chess.js"></script>
</body>
</html>
